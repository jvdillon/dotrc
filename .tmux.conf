# Prefix: Ctrl+x (matching .screenrc)
set -g prefix C-x
unbind C-b
bind C-x send-prefix

# Basics
set -g mouse on
set -g set-clipboard on
set -g history-limit 50000
set -g visual-bell off
set -g bell-action none
set -g focus-events on

# F-key bindings (matching .screenrc)
bind -n F7 detach
bind -n F8 kill-window
bind -n F9 command-prompt "rename-window '%%'"
bind -n F10 new-window
bind -n F11 previous-window
bind -n F12 next-window

# Status bar (matching .screenrc hardstatus)
set -g status-style bg=default,fg=green
set -g status-left-length 20
set -g status-left "#[bold,fg=brightgreen] Screen(s): "
set -g status-right "#[bold,fg=brightgreen,bg=black]%l:%M%p  %a, %b-%d-%Y "
set -g window-status-format "#[fg=blue]#I #W"
set -g window-status-current-format "#[fg=blue,bold]#I* #W"

# Screen-style bindings (d/c/n/p are already tmux defaults)
bind k kill-window
bind A command-prompt "rename-window '%%'"
bind b run "tmux save-buffer - | xsel -i -b"
bind Escape copy-mode
